<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrightMinds</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background: #ffc107;
      color: #222;
      overflow-x: hidden;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 2rem 4rem;
      box-sizing: border-box;
    }
    .left-box {
      background: #ff61a6;
      color: #fff;
      padding: 4rem;
      font-size: 6rem;
      line-height: 1.2;
      text-shadow: 4px 4px #000;
      border-radius: 30px;
      box-shadow: 0 0 0 12px #ec407a, inset 0 0 0 6px #fff;
      animation: typing 3s steps(20) 1 forwards;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    .right-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2rem;
    }
    .get-started {
      font-size: 2rem;
      color: #d500f9;
      text-shadow: 2px 2px #000;
      animation: blink 1.5s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .btn-box {
      background: #fff;
      padding: 1.5rem 3rem;
      font-size: 1rem;
      color: #000;
      border-radius: 16px;
      box-shadow: 6px 6px 0 #000;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .btn-box:hover {
      transform: scale(1.1);
      background-color: #ffeb3b;
    }
    @media (max-width: 900px) {
      .hero {
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .left-box {
        margin-bottom: 2rem;
        font-size: 3rem;
        width: 100% !important;
      }
      .right-content {
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="left-box">Bright Minds</div>
    <div class="right-content">
      <div class="get-started">get started</div>
      <a href="#signup" class="btn-box">Sign-Up</a>
      <a href="#message" class="btn-box">Our Message</a>
    </div>
  </div>
</body>
</html>
