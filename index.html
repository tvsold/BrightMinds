<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrightMinds</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background: #ffc107;
      color: #222;
      overflow-x: hidden;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 2rem 4rem;
      box-sizing: border-box;
    }
    .left-box {
      background: #ff61a6;
      color: #fff;
      padding: 3rem;
      font-size: 3rem;
      line-height: 1.4;
      text-shadow: 2px 2px #000;
      border-radius: 25px;
      box-shadow: 0 0 0 10px #ec407a, inset 0 0 0 5px #fff;
    }
    .right-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .get-started {
      font-size: 1rem;
      background: transparent;
      color: #d500f9;
      border: none;
      text-shadow: 1px 1px #000;
      animation: typing 2s steps(20) infinite alternate;
      white-space: nowrap;
      overflow: hidden;
      width: 15ch;
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 15ch; }
    }
    .btn-box {
      background: #fff;
      padding: 1rem 2rem;
      font-size: 0.7rem;
      color: #000;
      border-radius: 12px;
      box-shadow: 4px 4px 0 #000;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .btn-box:hover {
      transform: scale(1.05);
      background-color: #ffeb3b;
    }
    @media (max-width: 900px) {
      .hero {
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .left-box {
        margin-bottom: 2rem;
        font-size: 2rem;
      }
      .right-content {
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="left-box">
      Bright<br>Minds
    </div>
    <div class="right-content">
      <div class="get-started">get started</div>
      <a href="#signup" class="btn-box">Sign-Up</a>
      <a href="#message" class="btn-box">Our Message</a>
    </div>
  </div>
</body>
</html>
